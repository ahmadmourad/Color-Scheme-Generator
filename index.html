<html lang="en">
<head>
    <link rel="stylesheet" href="./style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./images/Icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Color Scheme Generator</title>
</head>
<body>
    <header>
        <input type="color" value="#F55A5A" id="input-color">
        <select name="color-scheme" id="color-scheme">
            <option value="monochrome">Monochrome</option>
            <option value="monochrome-dark">Monochrome-dark</option>
            <option value="monochrome-light">Monochrome-light</option>
            <option value="analogic">Analogic</option>
            <option value="complement">Complement</option>
            <option value="analogic-complement">Analogic-complement</option>
            <option value="triad">Triad</option>
            <option value="quad">Quad</option>
        </select>       
        <button type="button" class="get-color-btn" id="get-color-btn">Get color scheme</button>
    </header>

    <main>
        <div class="first-color"></div>
        <div class="second-color"></div>
        <div class="third-color"></div>
        <div class="fourth-color"></div>
        <div class="fifth-color"></div>
    </main>
    <footer>
        <div class="first-color-hexcode">#F55A5A</div>
        <div class="second-color-hexcode">#2B283A</div>
        <div class="third-color-hexcode">#FBF3AB</div>
        <div class="fourth-color-hexcode">#AAD1B6</div>
        <div class="fifth-color-hexcode">#A626D3</div>
    </footer>
    <script src="./script.js" type="module"></script>
</body>
</html>
